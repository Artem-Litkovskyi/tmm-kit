[project]
name = "tmm-kit"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "scipy-stubs==1.18.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers --capture=no"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Enable standard Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), and pydocstyle (D)
select = ["F", "E", "W", "I", "UP", "D"]
ignore = ["F403", "F405", "E731", "UP040", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"